[project]
name = "dify-autope-backend"
version = "0.1.0"
description = "Independent Dify workflow evaluation platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "cryptography>=45.0,<46.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "dspy-ai>=3.4.1",
  "python-dotenv>=1.2,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.9,<1.0",
  "alembic>=1.14,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI's dependency injection intentionally uses Depends(...) in endpoint defaults.
ignore = ["B008"]

